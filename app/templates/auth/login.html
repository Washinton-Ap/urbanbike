<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — UrbanBike</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>

<!-- Theme toggle flotante -->
<button id="theme-toggle" class="theme-toggle"
        style="position:fixed; top:16px; right:16px; z-index:200;"
        title="Cambiar tema" aria-label="Cambiar tema"></button>

<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div style="display:inline-flex; align-items:center; gap:10px; margin-bottom:6px;">
        <svg width="36" height="36" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7"  cy="20" r="5" stroke="#1E86BD" stroke-width="2.2"/>
          <circle cx="21" cy="20" r="5" stroke="#1E86BD" stroke-width="2.2"/>
          <path d="M7 20 L12 8 L18 14 L21 20" stroke="#1E86BD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="14" cy="6" r="2" fill="#1E86BD"/>
        </svg>
        <span class="login-logo-name">Urban<span>Bike</span></span>
      </div>
      <p class="login-subtitle">Sistema de gestión de bicicletas</p>
    </div>

    <!-- Error -->
    {% if error %}
    <div class="flash error" style="margin-bottom: 16px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <!-- Formulario -->
    <form method="post" action="/auth/login">
      <input type="hidden" name="next" value="{{ next | default('/dashboard') }}">

      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-input"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary w-full mt-4" style="justify-content:center; padding:11px;">
        Iniciar sesión
      </button>
    </form>

  </div>
</div>

</body>
</html>
