<!DOCTYPE html>
<html lang="es" data-theme="light" data-font-size="grande">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — UrbanBike</title>
  <link rel="icon" type="image/png" href="/static/img/logo-urbanbike.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/password-toggle.js"></script>
  <script src="/static/js/usabilidad.js"></script>
  <script src="/static/js/loading.js"></script>
  <script src="/static/js/solo-numeros.js" defer></script>
</head>
<body>

<!-- Theme toggle flotante -->
<button id="theme-toggle" class="theme-toggle"
        style="position:fixed; top:16px; right:16px; z-index:200;"
        title="Cambiar tema" aria-label="Cambiar tema"></button>

<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div style="display:inline-flex; align-items:center; gap:10px; margin-bottom:6px;">
        <img src="/static/img/logo-urbanbike.png" alt="" width="36" height="27">
        <span class="login-logo-name">Urban<span>Bike</span></span>
      </div>
      <p class="login-subtitle">Crea tu cuenta de ciclista</p>
    </div>

    <!-- Error -->
    {% if error %}
    <div class="flash error" style="margin-bottom: 16px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <div class="flash info" style="margin-bottom:16px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      Después de crear tu cuenta te enviaremos un código de verificación por correo -- lo necesitas para poder iniciar sesión.
    </div>

    <!-- Formulario -->
    <form method="post" action="/auth/registro">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" class="form-input"
                 value="{{ nombre or '' }}" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="apellido">Apellido</label>
          <input id="apellido" name="apellido" type="text" class="form-input"
                 value="{{ apellido or '' }}" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-input"
          placeholder="correo@ejemplo.com"
          value="{{ email or '' }}"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="cedula">Cédula</label>
        <input
          id="cedula"
          name="cedula"
          type="text"
          class="form-input"
          placeholder="10 dígitos"
          inputmode="numeric"
          pattern="[0-9]{10}"
          maxlength="10"
          value="{{ cedula or '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="telefono">Teléfono</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          class="form-input"
          placeholder="10 dígitos"
          inputmode="numeric"
          pattern="[0-9]{10}"
          maxlength="10"
          value="{{ telefono or '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="Mínimo 8 caracteres"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password_conf">Confirmar contraseña</label>
        <input
          id="password_conf"
          name="password_conf"
          type="password"
          class="form-input"
          placeholder="Repite la contraseña"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary w-full mt-4" style="justify-content:center; padding:11px;">
        Crear cuenta
      </button>
    </form>

    <div style="text-align:center;margin-top:18px;font-size:0.85rem;color:var(--text-muted);">
      ¿Ya tienes cuenta? <a href="/auth/login" style="color:var(--primary);font-weight:600;">Iniciar sesión</a>
    </div>

  </div>
</div>

</body>
</html>
