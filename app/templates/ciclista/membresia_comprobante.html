{% extends "base.html" %}
{% block title %}Comprobante de Membresía{% endblock %}
{% block page_title %}Comprobante de Membresía{% endblock %}

{% block content %}

<div class="card no-print" style="max-width:680px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:16px;">
  <a href="/ciclista/membresia/comprobante/{{ membresia.id }}/pdf" class="btn btn-ghost">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Descargar PDF
  </a>
  <button onclick="window.print()" class="btn btn-ghost">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    Imprimir
  </button>
  <a href="/ciclista/membresia" class="btn btn-primary">Volver</a>
</div>

<div class="flash success" style="max-width:680px;margin:0 auto 16px;font-weight:700;">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  Membresía activada
</div>

<div style="max-width:680px;margin:0 auto 10px;display:flex;justify-content:flex-end;">
  <span title="Simulación académica: este comprobante es simulado, ningún cargo real se procesó." style="display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);font-size:0.75rem;cursor:help;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    Simulado
  </span>
</div>

<div style="max-width:680px;margin:0 auto;">
  {% include "componentes/factura.html" %}
</div>

{% endblock %}
